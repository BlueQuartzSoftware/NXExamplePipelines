    "silhouette_convention": "Native a(i) sums distances to all selected members of the own positive group, including zero self-distance, and divides by group size n. b(i) is the smallest mean distance to a different nonempty positive group. The output is (b-a)/max(a,b). Canonical leave-one-out silhouette uses n-1 for a(i), so cross-library values need not match.",
    "silhouette_selection": "Summarize only InteriorFeatures=true rows with positive group IDs. Excluded rows and reserved row zero contain placeholder zero scores. Require at least two nonempty positive groups and finite scores; a zero denominator produces NaN."
