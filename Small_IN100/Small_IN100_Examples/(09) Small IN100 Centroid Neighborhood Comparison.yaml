  "parameter_rationale": {
    "epsilon": "Compare 2.5 and 3.0 micrometers: 10 and 12 voxels at the source spacing of 0.25 micrometers, near the selected-centroid median nearest-neighbor distance of about 1.78964 micrometers. These are illustrative scales, not optimized radii or an inferred material length.",
    "min_points": "Two centroids within a grid cell seed a core grid. In 3D cell side is epsilon/sqrt(3); this threshold is not the conventional point-neighborhood MinPts rule.",
    "distance_metric_index": "Zero selects Euclidean distance between three centroid coordinates. Inter-grid connections require distance strictly below epsilon.",
    "units": "All three coordinates are in micrometers. Separate axis standardization would alter the physical distance being studied.",
    "parse_order_index": "Zero is deterministic Low Density First. The serialized seed value 5489 and seed-array name are inactive in this mode; no seed array is created.",
    "mask": "Both DBSCAN runs use InteriorFeatures = NumElements > 0 AND SurfaceFeatures == 0. This selection does not prove complete grains or an unbiased spatial population.",
    "assignment_masks": "For each radius, Assigned = InteriorFeatures AND group IDs > 0. Zero IDs combine excluded rows with selected-but-unassigned noise; preserve the original mask.",
    "silhouette_convention": "Native a(i) includes zero self-distance and divides the own-group distance sum by n. b(i) is the smallest mean distance to another nonempty positive group. Score=(b-a)/max(a,b); conventional silhouette uses n-1 for a(i).",
    "silhouette_interpretation": "Only assigned rows enter each score. The radii have different scored cohorts, and compact separated groups are favored over long connected networks. Mean scores are not a radius-optimization criterion.",
    "cell_maps": "Copy both IDs, InteriorFeatures, and NearestInteriorCentroidDistance using original FeatureIds with suffix _Map. Group IDs are categorical; nearest distance is continuous and valid only where InteriorFeatures_Map is true.",
    "csv": "Comma delimiter, no feature-count line, and no packed neighbor lists retain a rectangular table. Row zero is omitted; unused positive rows remain. CSV uses eight significant digits for float32 measurements and sixteen for float64 silhouette scores.",
    "distance_cohort": "Convert InteriorFeatures to int32 (scalar_type_index 4), preserve the original mask, and use 0 excluded / 1 selected as an analysis ensemble. This is not material phase data; physical phase arrays remain unchanged.",
    "distance_selection": "ComputeFeatureClustering uses phase_number 1 on InteriorCentroidCohort and remove_biased_features false. Both endpoints must be in the selected cohort before pairs are constructed; each of 1349 selected original feature rows receives 1348 distances to other selected rows, with self excluded.",
    "temporary_reference": "The native filter requires RDF outputs. A separate two-row temporary attribute matrix receives one RDF bin and min/max. One bin minimizes unused histogram output; fixed seed 5489 makes only this discarded reference reproducible and has no effect on pair distances. Delete the whole temporary group and stored seed; no RDF correction or interpretation is applied. The compiled normalization defect is recorded at https://github.com/BlueQuartzSoftware/simplnx/issues/1820.",
    "distance_statistics": "Compute only neighbor-list length and minimum, with all five other statistics false. An excluded row has an empty list, count zero, and minimum zero; minimum zero is an invalid placeholder requiring InteriorFeatures and a positive count. On other inputs, distinct selected features can have coincident centroids and a valid zero minimum: validity depends on cohort and positive list count, not minimum > 0.",
    "distance_meaning": "NearestInteriorCentroidDistance is center-to-center spacing in micrometers within the selected cohort. It is not a surface gap, a shared-boundary neighbor distance, or a nearest-feature ID. Original feature row IDs, not DBSCAN group IDs, index the lists.",
    "distance_scale": "1349*1348 = 1818452 directed float32 entries, approximately 7.3 MB of values plus list/storage overhead and the fixed 1000-point temporary reference. Work and retained distances scale quadratically with selected feature count; do not apply this as voxel all-pairs analysis."
  },
