  "parameter_rationale": {
    "epsilon": "Compare 2.5 and 3.0 micrometers: 10 and 12 voxels at the source spacing of 0.25 micrometers, near the selected-centroid median nearest-neighbor distance of about 1.78964 micrometers. These are illustrative scales, not optimized radii or an inferred material length.",
    "min_points": "Two centroids within a grid cell seed a core grid. In 3D cell side is epsilon/sqrt(3); this threshold is not the conventional point-neighborhood MinPts rule.",
    "distance_metric_index": "Zero selects Euclidean distance between three centroid coordinates. Inter-grid connections require distance strictly below epsilon.",
    "units": "All three coordinates are in micrometers. Separate axis standardization would alter the physical distance being studied.",
    "parse_order_index": "Zero is deterministic Low Density First. The serialized seed value 5489 and seed-array name are inactive in this mode; no seed array is created.",
    "mask": "Both DBSCAN runs use InteriorFeatures = NumElements > 0 AND SurfaceFeatures == 0. This selection does not prove complete grains or an unbiased spatial population.",
    "assignment_masks": "For each radius, Assigned = InteriorFeatures AND group IDs > 0. Zero IDs combine excluded rows with selected-but-unassigned noise; preserve the original mask.",
    "silhouette_convention": "Native a(i) includes zero self-distance and divides the own-group distance sum by n. b(i) is the smallest mean distance to another nonempty positive group. Score=(b-a)/max(a,b); conventional silhouette uses n-1 for a(i).",
    "silhouette_interpretation": "Only assigned rows enter each score. The radii have different scored cohorts, and compact separated groups are favored over long connected networks. Mean scores are not a radius-optimization criterion.",
    "cell_maps": "Copy both IDs and InteriorFeatures using original FeatureIds with suffix _Map. This supports categorical inspection while preserving segmentation.",
    "csv": "Comma delimiter, no feature-count line, and no packed neighbor lists retain a rectangular table. Row zero is omitted; unused positive rows remain. CSV uses eight significant digits for float32 measurements and sixteen for float64 silhouette scores."
  },
