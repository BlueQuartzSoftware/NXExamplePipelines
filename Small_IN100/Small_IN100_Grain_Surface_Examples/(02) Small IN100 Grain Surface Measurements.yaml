  "last_verified": "2026-10-15",
  "verification_status": "Combined 31-step pipeline passed native preflight and execution on the matching Windows in-memory Release runtime. All 67 baseline datasets and the scalar CSV are unchanged; the 13 new face arrays match the verified standalone output exactly. Historical grid and analytic curvature checks retain their original scope. Materials interpretation, OOC, generated Python, GUI and full installation remain separate checks.",
  "mcp": {
    "user_intents": [
      "Measure the enclosed volume and mean unique surface-vertex position of a closed Small IN100 grain shell while mapping local region 1 to original FeatureId 2205.",
      "Compare the response of local polynomial curvature fits to the same faceted grain surface.",
      "Inspect principal and derived curvature fields without altering mesh geometry or original neighboring-grain provenance."
    ],
    "questions_to_ask": [
      "Is the source shell independently closed and outward oriented?",
      "Does the user need a volume centroid or unique-surface-vertex mean?",
      "How should local region IDs map to original reconstructed labels?",
      "Is the intended result a reconstruction diagnostic or a physical smooth-boundary measurement?",
      "Are geometry, normals, winding, units and face identities consistent?",
      "Does grouping describe the full grain-versus-complement envelope or separate physical neighboring interfaces?",
      "What independent geometric reference and neighborhood scale will support an adapted interpretation?"
    ],
    "constraints": [
      "Read the stage 01 checkpoint; do not reinterpret original neighbor FaceLabels as local closed regions.",
      "LocalSurfaceLabels is [-1,1] for the single outward shell.",
      "OriginalFeatureIds maps local row 1 to source FeatureId 2205; row 0 is unused.",
      "SurfaceVertexMeans averages distinct surface vertices, not enclosed volume.",
      "Positive output volume alone does not certify closure or outward winding.",
      "Compute both local curvature fits in this measurement stage before the final writer. Keep the existing measurement checkpoint and scalar CSV; curvature fields are face arrays in the native checkpoint.",
      "Preserve the 508-face, 256-vertex unsmoothed shell, Micrometer units and original identities; the source spacing is 0.25 micrometers.",
      "Pair all-one SurfaceRegionIds only with uniform LocalSurfaceLabels [-1,1]. OriginalFaceLabels has six neighboring-grain pairs and remains provenance; never pair it with all-one IDs.",
      "Ring 1 includes the seed and matching-label triangles sharing vertices, giving 9 to 19 triangles per patch here. It is not a physical-distance radius. Issue 1819 (https://github.com/BlueQuartzSoftware/simplnx/issues/1819) records nonfinite directions without a reported error from a singular local frame, including a ring-2 closed cube. This ring-1 result is specific to this shell; larger rings are not automatically better, and other meshes require separate checks.",
      "Both modes use the seed face normal to define the local frame and use face centroids, not vertices, as fitting locations.",
      "use_normals=false fits x^2/2, x*y and y^2/2; true adds x^3, x^2*y, x*y^2 and y^3. It does not add neighboring-normal equations or row weighting in the current implementation.",
      "Do not claim reproduction of Goldfeather and Interrante section 4.3 or transfer its reported accuracy advantage to this implementation.",
      "Enable principal directions, mean and Gaussian curvature for both fits. Keep experimental Weingarten output disabled.",
      "K1>=K2, Mean=(K1+K2)/2 and Gaussian=K1*K2. K1, K2 and Mean have units micrometer^-1; Gaussian has units micrometer^-2.",
      "CurvatureFaceCentroids contains XYZ micrometer coordinates; principal directions are dimensionless unit tangent vectors in the geometry coordinate system.",
      "Signed curvature depends on winding and normals. Principal directions are axes with arbitrary vector sign, nonunique at equal curvature and unstable near equality.",
      "Compare both Mean fields with a shared display range. Larger magnitudes or a smoother appearance do not establish better accuracy.",
      "Do not infer physical smooth grain-boundary curvature, stress, boundary energy or growth rate from these faceted-envelope diagnostic outputs.",
      "No smoothing or remeshing is performed. Adaptation must separately assess geometry, scale, topology and local fit behavior against a suitable reference."
    ],
