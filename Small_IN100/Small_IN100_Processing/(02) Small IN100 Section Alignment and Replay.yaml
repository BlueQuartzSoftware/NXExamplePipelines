    "constraints": [
      "The .d3dpipeline is executable authority. Run Archive -> Feature Preparation -> this pipeline. The legacy (02) Full Reconstruction is a different pipeline and is not included in this repository collection.",
      "The input already underwent section alignment and cleanup. Describe these results as a new estimate on that processed cohort, not recovered acquisition motion.",
      "Use exactly N shift tuples for N Z sections. Row r targets local z=N-1-r. Row 0 is the fixed highest-Z anchor; Slice Indices row 0 [0,0] is a placeholder, not an actual slice pair.",
